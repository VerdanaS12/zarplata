<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101412" media="(prefers-color-scheme: dark)">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Калькулятор зарплаты</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23116149'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3E%E2%82%B8%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f5f1;--card:#ffffff;--ink:#16201b;--muted:#5e6a63;--line:#e2e5df;
  --accent:#116149;--accent-soft:#e3f1ea;--warn:#8a5a00;--warn-soft:#fff4dc;--chip:#eef0ec;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101412;--card:#181e1b;--ink:#e8ede9;--muted:#9aa7a0;--line:#2a332e;
    --accent:#4fc39a;--accent-soft:#17352a;--warn:#f0c060;--warn-soft:#3a2e12;--chip:#222a26;
  }
}
:root[data-theme="dark"]{
  --bg:#101412;--card:#181e1b;--ink:#e8ede9;--muted:#9aa7a0;--line:#2a332e;
  --accent:#4fc39a;--accent-soft:#17352a;--warn:#f0c060;--warn-soft:#3a2e12;--chip:#222a26;
}
:root{color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;overflow-wrap:anywhere;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1060px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
h1{font-size:26px;line-height:1.2;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0}
.lang{display:flex;background:var(--chip);border-radius:10px;padding:3px;flex-shrink:0}
.lang button,.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;border-radius:8px;cursor:pointer}
.lang button{padding:6px 12px}
.lang button.on,.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:4px;margin-bottom:18px}
.seg button{padding:9px 6px}
label.f{display:block;font-weight:600;font-size:13px;color:var(--muted);margin:0 0 6px}
.field{margin-bottom:14px}
.money{position:relative}
.money input{width:100%;font:inherit;font-size:24px;font-weight:700;padding:12px 44px 12px 14px;
  border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-variant-numeric:tabular-nums}
.money span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:20px;font-weight:600}
input.sm{width:100%;font:inherit;font-size:16px;font-weight:600;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink);font-variant-numeric:tabular-nums}
input:focus,select:focus{outline:none;border-color:var(--accent)}
select{width:100%;font:inherit;font-size:16px;text-overflow:ellipsis;padding:10px 34px 10px 12px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink);appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:end}
.checks{display:flex;flex-direction:column;gap:2px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer}
.chk input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent);flex-shrink:0}
details{border-top:1px solid var(--line);padding:4px 0}
details:last-of-type{border-bottom:1px solid var(--line)}
.checks+details{margin-top:10px}
summary{cursor:pointer;font-weight:700;padding:10px 0;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-size:20px;font-weight:400;line-height:1}
details[open] summary::after{content:"−"}
summary .badge{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 8px}
.dnote{font-size:13px;color:var(--muted);margin:0 0 12px}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
.warn p{margin:0}.warn p+p{margin-top:6px}
.hero{background:var(--accent-soft);border-radius:14px;padding:16px 18px;margin-bottom:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero .k{font-size:13px;color:var(--muted);font-weight:600}
.hero .v{font-size:clamp(22px,3vw,28px);font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.2}
.hero .v.acc{color:var(--accent)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 4px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.n{text-align:right;white-space:nowrap;font-weight:600;padding-left:12px}
td .hint{display:block;font-size:12px;color:var(--muted);font-weight:400}
tr.tot td{border-bottom:0;font-weight:800;padding-top:12px}
.ex{color:var(--muted);font-weight:400;font-size:13px}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;padding:9px 14px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
footer{margin-top:22px;color:var(--muted);font-size:13px}
footer p{margin:0 0 8px}
.lock{display:flex;gap:8px;color:var(--accent);font-weight:600}
.soon{display:flex;gap:8px}
@media (max-width:480px){
  h1{font-size:22px}.hero{grid-template-columns:1fr}.hero .v{font-size:24px}
  .card{padding:16px 14px}
  .money input{font-size:22px}
}
@media (max-width:400px){
  .row2{grid-template-columns:minmax(0,1fr);gap:0}
  .wrap{padding:16px 12px 40px}
  header{flex-direction:column-reverse;align-items:stretch}
  .lang{align-self:flex-end}
  td.n{font-size:14px;padding-left:8px}
}
@media print{.lang,.actions,.seg{display:none}body{background:#fff}.card{border:0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-i="title"></h1>
      <p class="sub" data-i="subtitle"></p>
    </div>
    <div class="lang" role="group" aria-label="Язык / Тіл">
      <button type="button" data-lang="ru">RU</button>
      <button type="button" data-lang="kz">ҚАЗ</button>
    </div>
  </header>

  <div class="grid">
    <section class="card">
      <div class="seg" role="group">
        <button type="button" data-mode="direct" data-i="modeDirect"></button>
        <button type="button" data-mode="reverse" data-i="modeReverse"></button>
      </div>

      <div class="field">
        <label class="f" for="amount" id="amountLabel"></label>
        <div class="money">
          <input id="amount" inputmode="numeric" autocomplete="off" value="300 000">
          <span>₸</span>
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label class="f" for="year" data-i="year"></label>
          <select id="year"><option value="2026">2026</option><option value="2025">2025</option></select>
        </div>
        <div class="field">
          <label class="f" for="employer" data-i="employer"></label>
          <select id="employer">
            <option value="too" data-i="empToo"></option>
            <option value="ip" data-i="empIp"></option>
            <option value="snr" data-i="empSnr"></option>
          </select>
        </div>
      </div>

      <div class="field">
        <label class="f" for="disability" data-i="disability"></label>
        <select id="disability">
          <option value="none" data-i="disNone"></option>
          <option value="12perm" data-i="dis12perm"></option>
          <option value="12temp" data-i="dis12temp"></option>
          <option value="3" data-i="dis3"></option>
        </select>
      </div>

      <div class="checks">
        <label class="chk"><input type="checkbox" id="basic" checked><span id="basicLabel"></span></label>
        <label class="chk"><input type="checkbox" id="pensioner"><span data-i="pensioner"></span></label>
        <label class="chk"><input type="checkbox" id="student"><span data-i="student"></span></label>
        <label class="chk"><input type="checkbox" id="before1975"><span data-i="before1975"></span></label>
      </div>

      <details id="dTrip">
        <summary><span data-i="tripTitle"></span><span class="badge" id="bTrip" hidden></span></summary>
        <p class="dnote" id="tripNote"></p>
        <div class="row2">
          <div class="field"><label class="f" for="daysRk" data-i="daysRk"></label><input class="sm num" id="daysRk" inputmode="numeric" placeholder="0"></div>
          <div class="field"><label class="f" for="rateRk" data-i="rateDay"></label><input class="sm num" id="rateRk" inputmode="numeric" placeholder="0"></div>
        </div>
        <div class="row2">
          <div class="field"><label class="f" for="daysAbr" data-i="daysAbr"></label><input class="sm num" id="daysAbr" inputmode="numeric" placeholder="0"></div>
          <div class="field"><label class="f" for="rateAbr" data-i="rateDay"></label><input class="sm num" id="rateAbr" inputmode="numeric" placeholder="0"></div>
        </div>
      </details>

      <details id="dPart">
        <summary><span data-i="partTitle"></span><span class="badge" id="bPart" hidden></span></summary>
        <p class="dnote" data-i="partNote"></p>
        <div class="row2">
          <div class="field"><label class="f" for="norm" data-i="norm"></label><input class="sm num" id="norm" inputmode="numeric" placeholder="—"></div>
          <div class="field"><label class="f" for="worked" data-i="worked"></label><input class="sm num" id="worked" inputmode="numeric" placeholder="—"></div>
        </div>
        <label class="chk"><input type="checkbox" id="hire"><span data-i="hire"></span></label>
      </details>

      <details id="dYtd">
        <summary><span data-i="ytdTitle"></span><span class="badge" id="bYtd" hidden></span></summary>
        <p class="dnote" id="ytdNote"></p>
        <div class="field"><label class="f" for="ytd" data-i="ytd"></label><input class="sm num" id="ytd" inputmode="numeric" placeholder="0"></div>
        <div class="field"><label class="f" for="disUsed" data-i="disUsed"></label><input class="sm num" id="disUsed" inputmode="numeric" placeholder="0"></div>
      </details>

      <div id="warn" class="warn" hidden></div>
    </section>

    <section class="card" aria-live="polite">
      <div class="hero">
        <div><div class="k" data-i="gross"></div><div class="v" id="heroGross">—</div></div>
        <div><div class="k" data-i="net"></div><div class="v acc" id="heroNet">—</div></div>
      </div>

      <div id="accrualBlock"><h2 data-i="secAccrual"></h2><table id="tAcc"></table></div>
      <h2 data-i="secEmployee"></h2>
      <table id="tEmp"></table>
      <h2 data-i="secEmployer"></h2>
      <table id="tEr"></table>

      <div class="actions">
        <button type="button" class="btn" id="copy" data-i="copy"></button>
        <button type="button" class="btn" id="print" data-i="print"></button>
      </div>
    </section>
  </div>

  <footer>
    <p class="lock"><span aria-hidden="true">🔒</span><span data-i="privacy"></span></p>
    <p class="soon"><span aria-hidden="true">📅</span><span data-i="soon2027"></span></p>
    <p id="disclaimer"></p>
  </footer>
</div>

<script>
/* ===== ПАРАМЕТРЫ ПО ГОДАМ — новый год добавляется одним блоком ===== */
const YEARS = {
  2026: { // Новый НК РК с 01.01.2026; Закон о бюджете на 2026–2028 гг. № 239-VIII
    MRP: 4325, MZP: 85000,
    IPN: 0.10, IPN_HIGH: 0.15, IPN_HIGH_THRESHOLD_MRP: 8500, // годовой облагаемый доход, нарастающим итогом
    BASIC_DED_MRP: 30,                 // базовый вычет, ст. 403, в месяц
    DIS_DED_12_MRP: 5000, DIS_DED_3_MRP: 882, // соц. вычет, ст. 404, в год
    CORR90_MRP: null,                  // корректировка 90% отменена
    OPV: 0.10, OPV_MAX_MZP: 50,
    OPVR: 0.035, OPVR_MAX_MZP: 50,
    VOSMS: 0.02, VOSMS_MAX_MZP: 20,
    OOSMS: 0.03, OOSMS_MAX_MZP: 40,
    SO: 0.05, SO_MIN_MZP: 1, SO_MAX_MZP: 7,
    SN_TOO: 0.06, SN_MINUS_SO: false, SN_MIN_MRP: 14, SN_IP_MRP: 1,
    PERDIEM_RK_MRP: 6, PERDIEM_ABR_MRP: 8
  },
  2025: { // НК РК (ред. до 01.01.2026)
    MRP: 3932, MZP: 85000,
    IPN: 0.10, IPN_HIGH: null, IPN_HIGH_THRESHOLD_MRP: null,
    BASIC_DED_MRP: 14,                 // стандартный вычет, в месяц
    DIS_DED_12_MRP: 882, DIS_DED_3_MRP: 882,
    CORR90_MRP: 25,                    // облагаемый доход −90%, если начислено не более 25 МРП
    OPV: 0.10, OPV_MAX_MZP: 50,
    OPVR: 0.025, OPVR_MAX_MZP: 50,
    VOSMS: 0.02, VOSMS_MAX_MZP: 10,
    OOSMS: 0.03, OOSMS_MAX_MZP: 10,
    SO: 0.05, SO_MIN_MZP: 1, SO_MAX_MZP: 7,
    SN_TOO: 0.11, SN_MINUS_SO: true, SN_MIN_MRP: 14, SN_IP_MRP: 1,
    PERDIEM_RK_MRP: 6, PERDIEM_ABR_MRP: 8
  }
};

/* ===== РАСЧЁТ ===== */
const r = x => Math.round(x);

// base — оклад за полный месяц; o — все параметры формы
function calc(base, o){
  const P = YEARS[o.year], {MRP, MZP} = P;
  const norm = o.norm > 0 ? o.norm : 0;
  const worked = norm ? Math.min(Math.max(o.worked || 0, 0), norm) : 0;
  const partial = norm > 0 && o.worked !== null && worked < norm;
  const accrued = partial ? r(base * worked / norm) : r(base);

  // суточные
  const limRk = P.PERDIEM_RK_MRP * MRP, limAbr = P.PERDIEM_ABR_MRP * MRP;
  const dRk = o.daysRk || 0, dAbr = o.daysAbr || 0;
  const perDiem = dRk * (o.rateRk || 0) + dAbr * (o.rateAbr || 0);
  const perDiemFree = dRk * Math.min(o.rateRk || 0, limRk) + dAbr * Math.min(o.rateAbr || 0, limAbr);
  const perDiemTaxed = perDiem - perDiemFree;

  const inc = accrued + perDiemTaxed; // доход, облагаемый налогами и взносами

  const pens = !!o.pensioner, dis = o.disability || 'none', anyDis = dis !== 'none', perm12 = dis === '12perm';
  const ex = {
    opv: pens || perm12,
    vosms: pens || anyDis || !!o.student,
    oosms: pens || anyDis || !!o.student,
    opvr: pens || perm12 || !!o.before1975,
    so: pens
  };

  const opv   = ex.opv   ? 0 : r(Math.min(inc, P.OPV_MAX_MZP*MZP) * P.OPV);
  const vosms = ex.vosms ? 0 : r(Math.min(inc, P.VOSMS_MAX_MZP*MZP) * P.VOSMS);

  // ИПН
  let tb = Math.max(0, inc - opv - vosms);
  const basicUsed = o.basic ? Math.min(tb, P.BASIC_DED_MRP*MRP) : 0;
  tb -= basicUsed;
  const disLimit = (dis==='12perm'||dis==='12temp') ? P.DIS_DED_12_MRP*MRP : dis==='3' ? P.DIS_DED_3_MRP*MRP : 0;
  const socialUsed = Math.min(tb, Math.max(0, disLimit - (o.disUsed || 0)));
  tb -= socialUsed;
  let corr = 0;
  if (P.CORR90_MRP && inc <= P.CORR90_MRP * MRP){ corr = r(tb * 0.9); tb -= corr; }
  let ipn, high = 0;
  if (P.IPN_HIGH){
    const threshold = P.IPN_HIGH_THRESHOLD_MRP * MRP;
    const low = Math.max(0, Math.min(tb, threshold - (o.ytd || 0)));
    high = tb - low;
    ipn = r(low*P.IPN + high*P.IPN_HIGH);
  } else ipn = r(tb * P.IPN);

  // работодатель
  const opvr  = ex.opvr  ? 0 : r(Math.min(inc, P.OPVR_MAX_MZP*MZP) * P.OPVR);
  const oosms = ex.oosms ? 0 : r(Math.min(inc, P.OOSMS_MAX_MZP*MZP) * P.OOSMS);
  const soBase = Math.min(Math.max(inc - opv, P.SO_MIN_MZP*MZP), P.SO_MAX_MZP*MZP);
  const so = ex.so ? 0 : r(soBase * P.SO);

  let sn = 0;
  if (o.employer === 'too'){
    let snBase = inc - opv - vosms;
    if (!o.hire) snBase = Math.max(snBase, P.SN_MIN_MRP*MRP);
    sn = r(Math.max(0, snBase * P.SN_TOO - (P.SN_MINUS_SO ? so : 0)));
  } else if (o.employer === 'ip'){
    sn = r(Math.max(0, P.SN_IP_MRP*MRP - (P.SN_MINUS_SO ? so : 0)));
  }

  const net = accrued + perDiem - opv - vosms - ipn;
  const employerTotal = opvr + oosms + so + sn;
  return { base: r(base), accrued, partial, worked, norm, perDiem, perDiemFree, perDiemTaxed, inc,
    opv, vosms, ipn, net, opvr, oosms, so, sn, employerTotal,
    total: accrued + perDiem, cost: accrued + perDiem + employerTotal,
    basicUsed, socialUsed, corr, taxable: tb, high, ex, P };
}

// обратный расчёт: подбираем оклад, при котором «на руки» = цель
function reverse(target, o){
  if (target <= 0) return calc(0, o);
  let lo = 0, hi = Math.max(target * 2, 200000);
  while (calc(hi, o).net < target && hi < 1e12) hi *= 2;
  for (let i = 0; i < 90; i++){ const mid = (lo+hi)/2; if (calc(mid, o).net < target) lo = mid; else hi = mid; }
  let g = Math.ceil(hi);
  while (g > 0 && calc(g - 1, o).net >= target) g--;
  return calc(g, o);
}

/* ===== ТЕКСТЫ ===== */
const T = {
ru:{
  title:'Калькулятор зарплаты', subtitle:'Налоги и взносы с зарплаты в Казахстане — 2025 и 2026 годы',
  modeDirect:'Оклад → на руки', modeReverse:'На руки → оклад',
  amountDirect:'Оклад за полный месяц, ₸', amountReverse:'Сумма на руки, ₸',
  year:'Год', employer:'Работодатель', empToo:'ТОО на общем режиме', empIp:'ИП на общем режиме', empSnr:'Упрощёнка (СНР)',
  disability:'Инвалидность', disNone:'Нет', dis12perm:'I или II группа, бессрочно', dis12temp:'I или II группа, на срок', dis3:'III группа',
  basic:(n,y)=>y===2026?`Базовый вычет ${n} МРП (есть заявление работника)`:`Стандартный вычет ${n} МРП (есть заявление работника)`,
  pensioner:'Пенсионер по возрасту', student:'Студент очной формы обучения', before1975:'Родился до 1 января 1975 года',
  tripTitle:'Командировка', tripNote:(a,b)=>`Суточные не облагаются в пределах 6 МРП в день по Казахстану (${a}) и 8 МРП за рубежом (${b}), если командировка короче 40 дней. Превышение облагается всеми налогами. Проезд и жильё по документам не облагаются — их вводить не нужно.`,
  daysRk:'Дней по Казахстану', daysAbr:'Дней за рубежом', rateDay:'Суточные в день, ₸',
  partTitle:'Неполный месяц', partNote:'Для приёма или увольнения в середине месяца, отпуска без содержания, неполной ставки. Оклад пересчитается пропорционально отработанным дням.',
  norm:'Норма рабочих дней', worked:'Отработано дней', hire:'Месяц приёма или увольнения (СН — от фактического дохода, без минимума 14 МРП)',
  ytdTitle:'Высокие доходы и вычеты с начала года',

  opv:'МЗЖ — міндетті зейнетақы жарналары, 10%', vosms:'МӘМСҚ жарналары, 2%', ipn:'ЖТС — жеке табыс салығы',
  opvr:p=>`ЖМЗЖ — жұмыс берушінің зейнетақы жарналары, ${pct(p)}`, oosms:'МӘМСҚ аударымдары, 3%', so:'ӘА — әлеуметтік аударымдар, 5%', sn:'ӘС — әлеуметтік салық',
  snToo:(p,minus)=>minus?`(табыс − МЗЖ − МӘМСҚ жарналары) сомасынан ${pct(p)}, минус ӘА, база кемінде 14 АЕК`:`(табыс − МЗЖ − МӘМСҚ жарналары) сомасынан ${pct(p)}, база кемінде 14 АЕК`,
  snTooHire:(p,minus)=>minus?`(табыс − МЗЖ − МӘМСҚ жарналары) сомасынан ${pct(p)}, минус ӘА, нақты табыстан`:`(табыс − МЗЖ − МӘМСҚ жарналары) сомасынан ${pct(p)}, нақты табыстан`,

/* ===== ИНТЕРФЕЙС ===== */
const $ = id => document.getElementById(id);
const sp = n => Math.round(n).toLocaleString('ru-RU').replace(/[  ]/g,' ');
const fmt = n => sp(n) + ' ₸';
function pct(p){ return String(+(p*100).toFixed(2)).replace('.', ',') + '%'; }
const num = id => { const v = ($(id).value || '').replace(/[^\d]/g,''); return v === '' ? null : Number(v); };
let lang = 'ru', mode = 'direct', last = null;
try { const s = localStorage.getItem('zp-lang'); if (s === 'kz' || s === 'ru') lang = s; } catch(e){}

function opts(){
  return { year:Number($('year').value), employer:$('employer').value, disability:$('disability').value,
    basic:$('basic').checked, pensioner:$('pensioner').checked, student:$('student').checked, before1975:$('before1975').checked,
    daysRk:num('daysRk')||0, rateRk:num('rateRk')||0, daysAbr:num('daysAbr')||0, rateAbr:num('rateAbr')||0,
    norm:num('norm')||0, worked:num('worked'), hire:$('hire').checked,
    ytd:num('ytd')||0, disUsed:num('disUsed')||0 };
}

function applyLang(){
  const t = T[lang];
  document.documentElement.lang = lang === 'kz' ? 'kk' : 'ru';
  document.title = t.title;
  document.querySelectorAll('[data-i]').forEach(el => { const v = t[el.dataset.i]; if (typeof v === 'string') el.textContent = v; });
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  render();
}

function row(label, val, hint, exempt){
  const v = exempt ? `<span class="ex">${T[lang].exempt}</span>` : fmt(val);
  return `<tr><td>${label}${hint?`<span class="hint">${hint}</span>`:''}</td><td class="n">${v}</td></tr>`;
}

function render(){
  const t = T[lang], o = opts(), a = Number(($('amount').value||'').replace(/[^\d]/g,'')) || 0, P = YEARS[o.year];
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  $('amountLabel').textContent = mode === 'direct' ? t.amountDirect : t.amountReverse;
  $('basicLabel').textContent = t.basic(P.BASIC_DED_MRP, o.year);
  $('tripNote').textContent = t.tripNote(fmt(P.PERDIEM_RK_MRP*P.MRP), fmt(P.PERDIEM_ABR_MRP*P.MRP));
  $('ytdNote').textContent = t.ytdNote(P.IPN_HIGH_THRESHOLD_MRP ? fmt(P.IPN_HIGH_THRESHOLD_MRP*P.MRP) : '', o.year);
  $('disclaimer').textContent = t.disclaimer(o.year);

  const c = mode === 'direct' ? calc(a, o) : reverse(a, o);
  last = c;
  $('heroGross').textContent = fmt(c.total);
  $('heroNet').textContent = fmt(c.net);

  // бейджи на свёрнутых блоках
  $('bTrip').hidden = !c.perDiem; $('bTrip').textContent = fmt(c.perDiem);
  $('bPart').hidden = !c.partial; $('bPart').textContent = `${c.worked}/${c.norm}`;
  $('bYtd').hidden = !(o.ytd || o.disUsed); $('bYtd').textContent = '✓';

  // начисления — только если есть неполный месяц или суточные
  let acc = '';
  if (c.partial || c.perDiem){
    acc += row(t.accSalary, c.accrued, c.partial ? t.accSalaryHint(c.worked, c.norm, fmt(c.base)) : '', false);
    if (c.perDiem) acc += row(t.accPerDiem, c.perDiem, t.accPerDiemHint(fmt(c.perDiemFree), c.perDiemTaxed ? fmt(c.perDiemTaxed) : ''), false);
  }
  $('accrualBlock').hidden = !acc; $('tAcc').innerHTML = acc;

  let ipnHint = t.ipnHint(fmt(c.taxable), fmt(c.basicUsed), c.socialUsed ? fmt(c.socialUsed) : '', c.corr ? fmt(c.corr) : '');
  if (c.high > 0) ipnHint += '; ' + t.ipnHigh(fmt(c.high));
  $('tEmp').innerHTML =
    row(t.opv, c.opv, '', c.ex.opv) + row(t.vosms, c.vosms, '', c.ex.vosms) + row(t.ipn, c.ipn, ipnHint, false) +
    `<tr class="tot"><td>${t.totalEmp}</td><td class="n">${fmt(c.opv+c.vosms+c.ipn)}</td></tr>`;

  const snHint = o.employer==='too' ? (o.hire ? t.snTooHire : t.snToo)(P.SN_TOO, P.SN_MINUS_SO) : o.employer==='ip' ? t.snIp(P.SN_MINUS_SO) : t.snSnr;
  $('tEr').innerHTML =
    row(t.opvr(P.OPVR), c.opvr, '', c.ex.opvr) + row(t.oosms, c.oosms, '', c.ex.oosms) +
    row(t.so, c.so, t.soHint, c.ex.so) + row(t.sn, c.sn, snHint, false) +
    `<tr class="tot"><td>${t.totalEr}</td><td class="n">${fmt(c.employerTotal)}</td></tr>` +
    `<tr class="tot"><td>${t.cost}</td><td class="n">${fmt(c.cost)}</td></tr>`;

  const w = [];
  if (c.base > 0 && c.base < P.MZP) w.push(t.warnLow);
  if (!o.basic && c.base > 0) w.push(t.warnBasicOff);
  if ((o.daysRk >= 40 && o.rateRk) || (o.daysAbr >= 40 && o.rateAbr)) w.push(t.warn40);
  if (o.norm && o.worked !== null && o.worked > o.norm) w.push(t.warnDays);
  $('warn').hidden = !w.length; $('warn').innerHTML = w.map(x=>`<p>${x}</p>`).join('');
}

function copyText(){
  const t = T[lang], c = last, o = opts(); if (!c) return;
  const e = (k, v) => c.ex[k] ? t.exempt : fmt(v);
  const L = [`${t.title} — ${o.year}`];
  if (c.partial) L.push(`${t.accSalary}: ${fmt(c.accrued)} (${t.accSalaryHint(c.worked, c.norm, fmt(c.base))})`);
  else L.push(`${t.amountDirect.replace(', ₸','')}: ${fmt(c.accrued)}`);
  if (c.perDiem) L.push(`${t.accPerDiem}: ${fmt(c.perDiem)} (${t.accPerDiemHint(fmt(c.perDiemFree), c.perDiemTaxed?fmt(c.perDiemTaxed):'')})`);
  L.push(`${t.opv}: ${e('opv',c.opv)}`, `${t.vosms}: ${e('vosms',c.vosms)}`, `${t.ipn}: ${fmt(c.ipn)}`, `${t.net}: ${fmt(c.net)}`, '',
    `${t.opvr(c.P.OPVR)}: ${e('opvr',c.opvr)}`, `${t.oosms}: ${e('oosms',c.oosms)}`, `${t.so}: ${e('so',c.so)}`, `${t.sn}: ${fmt(c.sn)}`, `${t.cost}: ${fmt(c.cost)}`);
  const done = () => { const b=$('copy'); b.textContent=t.copied; setTimeout(()=>b.textContent=t.copy,1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(L.join('\n')).then(done).catch(()=>{});
}

function groupDigits(el, max){ const n = el.value.replace(/[^\d]/g,'').slice(0, max); el.value = n ? sp(Number(n)) : ''; }
$('amount').addEventListener('input', e => { groupDigits(e.target, 10); render(); });
document.querySelectorAll('input.num').forEach(el => el.addEventListener('input', () => {
  groupDigits(el, ['norm','worked','daysRk','daysAbr'].includes(el.id) ? 3 : 10); render();
}));
['year','employer','disability','basic','pensioner','student','before1975','hire'].forEach(id => $(id).addEventListener('change', render));
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
  if (mode === b.dataset.mode) return;
  const c = last; mode = b.dataset.mode;
  if (c) $('amount').value = sp(mode === 'direct' ? c.base : c.net);
  render();
}));
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang; try { localStorage.setItem('zp-lang', lang); } catch(e){}
  applyLang();
}));
$('copy').addEventListener('click', copyText);
$('print').addEventListener('click', () => window.print());
applyLang();
</script>
</body>
