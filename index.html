:root{
  --bg:#f5f6f9;--card:#ffffff;--ink:#141827;--muted:#626879;--line:#e4e6ee;--chip:#eff1f6;
  --accent:#1926cd;--accent-ink:#1926cd;--accent-soft:#eef0fd;--warn:#7a5a12;--warn-soft:#fbf5e6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1016;--card:#161923;--ink:#e9ebf3;--muted:#9ba1b5;--line:#272b39;--chip:#1e2230;
    --accent:#1926cd;--accent-ink:#8c95ff;--accent-soft:#1a1e42;--warn:#e7c77a;--warn-soft:#2e2718;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1016;--card:#161923;--ink:#e9ebf3;--muted:#9ba1b5;--line:#272b39;--chip:#1e2230;
  --accent:#1926cd;--accent-ink:#8c95ff;--accent-soft:#1a1e42;--warn:#e7c77a;--warn-soft:#2e2718;
  color-scheme:dark;
}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow-wrap:anywhere;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 48px}
[hidden]{display:none!important}

/* бренд */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:18px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit}
.logo{font-family:"EdubuhLogo",Montserrat,"Segoe UI",Arial,sans-serif;font-weight:600;font-size:26px;letter-spacing:.01em;color:#1926cd;line-height:1;white-space:nowrap;overflow-wrap:normal;flex-shrink:0}
.ct{width:100%;border-collapse:collapse}
.ct th{font-size:13px;text-align:right;padding:8px 0 8px 12px;border-bottom:1.5px solid var(--line);vertical-align:bottom;font-weight:700}
.ct th:first-child{text-align:left;padding-left:0}
.ct th.best{color:var(--accent-ink)}
.ct th .tag{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:999px;padding:2px 8px}
.ct td.n .hint{text-align:right;white-space:normal;max-width:190px;margin-left:auto}
.ct td.n.best{color:var(--accent-ink)}
.cmp-wide{display:block}.cmp.cmp-narrow{display:none}
@media (max-width:1000px) and (min-width:821px){.cmp-wide{display:none}.cmp.cmp-narrow{display:grid}}
@media (max-width:560px){.cmp-wide{display:none}.cmp.cmp-narrow{display:grid}}
.brand .sep{width:1px;align-self:stretch;background:var(--line)}
.tagline{font-size:13px;line-height:1.3;color:var(--muted);max-width:190px}
.lang{display:flex;background:var(--chip);border-radius:10px;padding:3px;flex-shrink:0}
.lang button,.seg button,.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;border-radius:8px;cursor:pointer}
.lang button{padding:6px 12px;font-size:14px}
.lang button.on,.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(15,20,40,.12)}

h1{font-size:26px;line-height:1.2;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tabs button{flex:0 1 auto;padding:9px 16px;border:1.5px solid var(--line);background:var(--card);border-radius:999px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}

.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.seg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--chip);border-radius:12px;padding:4px;margin-bottom:18px}
.seg button{padding:9px 6px}
label.f{display:block;font-weight:600;font-size:13px;color:var(--muted);margin:0 0 6px}
.field{margin-bottom:14px}
.money{position:relative}
.money input{width:100%;font:inherit;font-size:24px;font-weight:700;padding:12px 44px 12px 14px;
  border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-variant-numeric:tabular-nums}
.money span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:20px;font-weight:600}
input.sm{width:100%;font:inherit;font-size:16px;font-weight:600;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink);font-variant-numeric:tabular-nums}
input:focus,select:focus{outline:none;border-color:var(--accent-ink)}
select{width:100%;font:inherit;font-size:16px;text-overflow:ellipsis;padding:10px 34px 10px 12px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink);appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:end}
.checks{display:flex;flex-direction:column;gap:2px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer}
.chk input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent);flex-shrink:0}
.sub-box{background:var(--chip);border-radius:12px;padding:12px 12px 2px;margin:4px 0 10px}
.sub-box .dnote{margin-bottom:10px}
details{border-top:1px solid var(--line);padding:4px 0}
details.last{border-bottom:1px solid var(--line)}
.checks+details,.sub-box+details{margin-top:10px}
summary{cursor:pointer;font-weight:700;padding:10px 0;list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-size:20px;font-weight:400;line-height:1;margin-left:auto}
details[open] summary::after{content:"−"}
summary .badge{font-size:12px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 8px}
.dnote{font-size:13px;color:var(--muted);margin:0 0 12px}
.hsec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:6px 0 10px}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
.warn p{margin:0}.warn p+p{margin-top:6px}

.hero{background:var(--accent-soft);border-radius:14px;padding:16px 18px;margin-bottom:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.hero .k{font-size:13px;color:var(--muted);font-weight:600}
.hero .v{font-size:clamp(22px,3vw,28px);font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.2}
.hero .v.acc{color:var(--accent-ink)}
.hero .note{grid-column:1/-1;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 4px}
h2.big{color:var(--ink);margin-top:26px;font-size:14px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.n{text-align:right;white-space:nowrap;font-weight:600;padding-left:12px}
td .hint{display:block;font-size:12px;color:var(--muted);font-weight:400}
tr.tot td{border-bottom:0;font-weight:800;padding-top:12px}
.ex{color:var(--muted);font-weight:400;font-size:13px}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.cmp .box{border:1px solid var(--line);border-radius:14px;padding:4px 14px 8px}
.cmp .box.best{border-color:var(--accent-ink)}
.cmp h3{font-size:15px;margin:10px 0 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cmp h3 .tag{font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:999px;padding:2px 8px}
@media (max-width:1000px) and (min-width:821px){.cmp{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.cmp{grid-template-columns:minmax(0,1fr)}}
.rules{margin-top:18px;border-top:1px solid var(--line);padding-top:6px}
.rules h4{font-size:14px;margin:12px 0 4px}
.rules ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px}
.rules li{margin:3px 0}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;padding:9px 14px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:var(--accent-ink);color:var(--accent-ink)}
footer{margin-top:24px;color:var(--muted);font-size:13px}
footer p{margin:0 0 8px;display:flex;gap:8px}
footer .lock{color:var(--accent-ink);font-weight:600}
footer .fbrand{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);align-items:center}
footer .fbrand .logo{font-size:15px}
@media (max-width:560px){
  .topbar{align-items:flex-start}
  .brand{gap:10px}.logo{font-size:21px}.tagline{font-size:12px;max-width:150px}
}
@media (max-width:480px){
  h1{font-size:22px}.hero{grid-template-columns:minmax(0,1fr)}.hero .v{font-size:24px}
  .card{padding:16px 14px}.money input{font-size:22px}
  .tabs button{flex:1 1 auto;padding:8px 12px}
}
@media (max-width:400px){
  .row2{grid-template-columns:minmax(0,1fr);gap:0}
  .wrap{padding:16px 12px 40px}
  .topbar{flex-direction:column-reverse;align-items:stretch}
  .lang{align-self:flex-end}
  .tagline{max-width:none}
  td.n{font-size:14px;padding-left:8px}
}
@media (max-width:340px){.money input{font-size:19px;padding-right:38px}.money span{right:10px;font-size:17px}}
@media print{.lang,.actions,.seg,.tabs{display:none}body{background:#fff}.card{border:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand" aria-label="edubuh">
      <span class="logo">edubuh</span>
      <span class="sep" aria-hidden="true"></span>
      <span class="tagline" data-i="tagline"></span>
    </div>
    <div class="lang" role="group" aria-label="Язык / Тіл">
      <button type="button" data-lang="ru">RU</button>
      <button type="button" data-lang="kz">ҚАЗ</button>
    </div>
  </div>

  <h1 data-i="title"></h1>
  <p class="sub" data-i="subtitle"></p>

  <nav class="tabs" role="tablist">
    <button type="button" data-tab="zp" data-i="tabZp"></button>
    <button type="button" data-tab="trip" data-i="tabTrip"></button>
    <button type="button" data-tab="gph" data-i="tabGph"></button>
  </nav>

  <!-- ================= ДОГОВОР ГПХ ================= -->
  <div class="grid" data-pane="gph">

<script>
/* ===== ПАРАМЕТРЫ ПО ГОДАМ — новый год добавляется одним блоком ===== */
const YEARS = {
  2026: { // Новый НК РК с 01.01.2026; Закон о бюджете на 2026–2028 гг. № 239-VIII
    MRP: 4325, MZP: 85000,
    IPN: 0.10, IPN_HIGH: 0.15, IPN_HIGH_THRESHOLD_MRP: 8500,
    BASIC_DED_MRP: 30, DIS_DED_12_MRP: 5000, DIS_DED_3_MRP: 882, CORR90_MRP: null,
    OPV: 0.10, OPV_MAX_MZP: 50, OPVR: 0.035, OPVR_MAX_MZP: 50,
    VOSMS: 0.02, VOSMS_MAX_MZP: 20, OOSMS: 0.03, OOSMS_MAX_MZP: 40,
    SO: 0.05, SO_MIN_MZP: 1, SO_MAX_MZP: 7,
    SN_TOO: 0.06, SN_MINUS_SO: false, SN_MIN_MRP: 14, SN_IP_MRP: 1,
    PERDIEM_RK_MRP: 6, PERDIEM_ABR_MRP: 8, PERDIEM_MAX_DAYS: 40,
    GPH_SO_MIN_MZP: 0, GPH_SO_IN_IPN: true,   // ГПХ: минимальная база СО отменена, СО уменьшает базу ИПН
    // праздничные (нерабочие) дни с учётом переносов; рабочие выходные
    OFF: ['1-1','1-2','1-7','3-9','3-23','3-24','3-25','5-1','5-7','5-11','5-27','7-6','10-26','12-16'], WORK: []
  },
  2025: {
    MRP: 3932, MZP: 85000,
    IPN: 0.10, IPN_HIGH: null, IPN_HIGH_THRESHOLD_MRP: null,
    BASIC_DED_MRP: 14, DIS_DED_12_MRP: 882, DIS_DED_3_MRP: 882, CORR90_MRP: 25,
    OPV: 0.10, OPV_MAX_MZP: 50, OPVR: 0.025, OPVR_MAX_MZP: 50,
    VOSMS: 0.02, VOSMS_MAX_MZP: 10, OOSMS: 0.03, OOSMS_MAX_MZP: 10,
    SO: 0.05, SO_MIN_MZP: 1, SO_MAX_MZP: 7,
    SN_TOO: 0.11, SN_MINUS_SO: true, SN_MIN_MRP: 14, SN_IP_MRP: 1,
    PERDIEM_RK_MRP: 6, PERDIEM_ABR_MRP: 8, PERDIEM_MAX_DAYS: 40,
    GPH_SO_MIN_MZP: 1, GPH_SO_IN_IPN: false,
    OFF: ['1-1','1-2','1-3','1-7','3-10','3-21','3-24','3-25','5-1','5-7','5-9','6-6','7-7','9-1','10-27','12-16'], WORK: ['1-5']
  }
};

/* ===== РАСЧЁТ ЗАРПЛАТЫ ===== */
const r = x => Math.round(x);

function calc(base, o){
  const P = YEARS[o.year], {MRP, MZP} = P;
  const norm = o.norm > 0 ? o.norm : 0;
  const worked = norm ? Math.min(Math.max(o.worked || 0, 0), norm) : 0;
  const partial = norm > 0 && o.worked !== null && o.worked !== undefined && worked < norm;
  const accrued = partial ? r(base * worked / norm) : r(base);

  const limRk = P.PERDIEM_RK_MRP * MRP, limAbr = P.PERDIEM_ABR_MRP * MRP;
  const dRk = o.daysRk || 0, dAbr = o.daysAbr || 0;
  const perDiem = dRk * (o.rateRk || 0) + dAbr * (o.rateAbr || 0);
  const perDiemFree = dRk * Math.min(o.rateRk || 0, limRk) + dAbr * Math.min(o.rateAbr || 0, limAbr);
  const perDiemTaxed = perDiem - perDiemFree;

  const inc = accrued + perDiemTaxed + (o.extra || 0);

  const pens = !!o.pensioner, dis = o.disability || 'none', anyDis = dis !== 'none', perm12 = dis === '12perm';
  const ex = { opv: pens || perm12, vosms: pens || anyDis || !!o.student, oosms: pens || anyDis || !!o.student,
    opvr: pens || perm12 || !!o.before1975, so: pens };

  const opv   = ex.opv   ? 0 : r(Math.min(inc, P.OPV_MAX_MZP*MZP) * P.OPV);
  const vosms = ex.vosms ? 0 : r(Math.min(inc, P.VOSMS_MAX_MZP*MZP) * P.VOSMS);

  let tb = Math.max(0, inc - opv - vosms);
  const basicUsed = o.basic ? Math.min(tb, P.BASIC_DED_MRP*MRP) : 0;
  tb -= basicUsed;
  const disLimit = (dis==='12perm'||dis==='12temp') ? P.DIS_DED_12_MRP*MRP : dis==='3' ? P.DIS_DED_3_MRP*MRP : 0;
  const socialUsed = Math.min(tb, Math.max(0, disLimit - (o.disUsed || 0)));
  tb -= socialUsed;
  let corr = 0;
  if (P.CORR90_MRP && inc <= P.CORR90_MRP * MRP){ corr = r(tb * 0.9); tb -= corr; }
  let ipn, high = 0;
  if (P.IPN_HIGH){
    const threshold = P.IPN_HIGH_THRESHOLD_MRP * MRP;
    const low = Math.max(0, Math.min(tb, threshold - (o.ytd || 0)));
    high = tb - low;
    ipn = r(low*P.IPN + high*P.IPN_HIGH);
  } else ipn = r(tb * P.IPN);

  const opvr  = ex.opvr  ? 0 : r(Math.min(inc, P.OPVR_MAX_MZP*MZP) * P.OPVR);
  const oosms = ex.oosms ? 0 : r(Math.min(inc, P.OOSMS_MAX_MZP*MZP) * P.OOSMS);
  const soBase = Math.min(Math.max(inc - opv, P.SO_MIN_MZP*MZP), P.SO_MAX_MZP*MZP);
  const so = ex.so ? 0 : r(soBase * P.SO);

  let sn = 0;
  if (o.employer === 'too'){
    let snBase = inc - opv - vosms;
    if (!o.hire) snBase = Math.max(snBase, P.SN_MIN_MRP*MRP);
    sn = r(Math.max(0, snBase * P.SN_TOO - (P.SN_MINUS_SO ? so : 0)));
  } else if (o.employer === 'ip'){
    sn = r(Math.max(0, P.SN_IP_MRP*MRP - (P.SN_MINUS_SO ? so : 0)));
  }

  const net = accrued + perDiem + (o.extra || 0) - opv - vosms - ipn;
  const employerTotal = opvr + oosms + so + sn;
  return { base: r(base), accrued, partial, worked, norm, perDiem, perDiemFree, perDiemTaxed, inc,
    opv, vosms, ipn, net, opvr, oosms, so, sn, employerTotal,
    total: accrued + perDiem, cost: accrued + perDiem + employerTotal,
    basicUsed, socialUsed, corr, taxable: tb, high, ex, P };
}

function reverse(target, o){
  if (target <= 0) return calc(0, o);
  let lo = 0, hi = Math.max(target * 2, 200000);
  while (calc(hi, o).net < target && hi < 1e12) hi *= 2;
  for (let i = 0; i < 90; i++){ const mid = (lo+hi)/2; if (calc(mid, o).net < target) lo = mid; else hi = mid; }
  let g = Math.ceil(hi);
  while (g > 0 && calc(g - 1, o).net >= target) g--;
  return calc(g, o);
}

/* рабочие дни (5-дневка) по половинам месяца с учётом праздников и переносов */
function workdays(y, m){
  const P = YEARS[y], last = new Date(y, m, 0).getDate();
  let a = 0, b = 0;
  for (let d = 1; d <= last; d++){
    const k = m + '-' + d, w = new Date(y, m - 1, d).getDay();
    const isWork = ((w > 0 && w < 6) && !P.OFF.includes(k)) || P.WORK.includes(k);
    if (!isWork) continue;
    if (d <= 15) a++; else b++;
  }
  return { a, b, last };
}

/* разбивка на две половины месяца */
function splitHalves(c, o){
  const d1 = Math.max(0, o.d1 || 0), d2 = Math.max(0, o.d2 || 0);
  let a1;
  if (o.advType === 'pct') a1 = r(c.base * Math.min(100, Math.max(0, o.advPct || 0)) / 100);
  else a1 = d1 + d2 > 0 ? r(c.accrued * d1 / (d1 + d2)) : 0;
  a1 = Math.min(a1, c.accrued);
  const share = c.accrued > 0 ? a1 / c.accrued : 0;
  const each = o.advTax === 'each';
  const h1 = { income:a1, opv: each ? r(c.opv*share) : 0, vosms: each ? r(c.vosms*share) : 0, ipn: each ? r(c.ipn*share) : 0 };
  h1.net = h1.income - h1.opv - h1.vosms - h1.ipn;
  const h2 = { income: c.accrued + c.perDiem + (o.extra||0) - a1, opv: c.opv - h1.opv, vosms: c.vosms - h1.vosms, ipn: c.ipn - h1.ipn };
  h2.net = h2.income - h2.opv - h2.vosms - h2.ipn;
  return { d1, d2, h1, h2 };
}

/* ===== ДОГОВОР ГПХ (физлицо-резидент, не ИП) ===== */
function calcGph(amount, o){
  const P = YEARS[o.year], {MRP, MZP} = P, inc = r(amount), pens = !!o.pensioner;
  // ОПВ и СО удерживаются только по работам и услугам; при продаже товаров и пассивной аренде — нет
  const services = !o.subj || o.subj === 'services';
  const opv   = pens || !services ? 0 : r(Math.min(inc, P.OPV_MAX_MZP*MZP) * P.OPV);
  const vosms = pens ? 0 : r(Math.min(inc, P.VOSMS_MAX_MZP*MZP) * P.VOSMS);
  let so = 0;
  if (!pens && services && inc > 0){
    const soBase = Math.min(Math.max(inc - opv, P.GPH_SO_MIN_MZP*MZP), P.SO_MAX_MZP*MZP);
    so = r(soBase * P.SO);
  }
  let tb = Math.max(0, inc - opv - vosms - (P.GPH_SO_IN_IPN ? so : 0));
  const basicUsed = o.basic ? Math.min(tb, P.BASIC_DED_MRP*MRP) : 0;
  tb -= basicUsed;
  let ipn, high = 0;
  if (P.IPN_HIGH){
    const threshold = P.IPN_HIGH_THRESHOLD_MRP * MRP;
    const low = Math.min(tb, threshold); high = tb - low;
    ipn = r(low*P.IPN + high*P.IPN_HIGH);
  } else ipn = r(tb * P.IPN);
  const withheld = opv + vosms + so + ipn;
  return { base:inc, opv, vosms, so, ipn, withheld, net: inc - withheld, basicUsed, taxable: tb, high, cost: inc, pens, services, P };
}
function reverseGph(target, o){
  if (target <= 0) return calcGph(0, o);
  let lo = 0, hi = Math.max(target * 2, 200000);
  while (calcGph(hi, o).net < target && hi < 1e12) hi *= 2;
  for (let i = 0; i < 90; i++){ const mid = (lo+hi)/2; if (calcGph(mid, o).net < target) lo = mid; else hi = mid; }
  let g = Math.ceil(hi);
  while (g > 0 && calcGph(g - 1, o).net >= target) g--;
  return calcGph(g, o);
}

/* ===== КОМАНДИРОВКА vs РАЗЪЕЗДНОЙ ХАРАКТЕР ===== */
function calcTrip(o){
  const P = YEARS[o.year];
  const days = o.days || 0, rate = o.rate || 0, docs = o.docs || 0;
  const paid = days * rate + docs;
  const docsTaxed = o.noDocs ? docs : 0;

  // командировка
  const lim = (o.dir === 'abr' ? P.PERDIEM_ABR_MRP : P.PERDIEM_RK_MRP) * P.MRP;
  const over40 = Math.min(o.over40 || 0, days);
  const normalDays = days - over40;
  const tripFree = normalDays * Math.min(rate, lim) + (o.noDocs ? 0 : docs);
  const tripTaxed = paid - tripFree;
  const tripParts = { overLimit: normalDays * Math.max(0, rate - lim), over40: over40 * rate, docs: docsTaxed };

  // разъездной характер
  const nrm = o.norm || 0;
  const roadFree = days * Math.min(rate, nrm) + (o.noDocs ? 0 : docs);
  const roadTaxed = paid - roadFree;
  const roadParts = { overLimit: days * Math.max(0, rate - nrm), docs: docsTaxed };

  const baseOpts = { year:o.year, employer:o.employer, basic:o.basic, disability:'none' };
  const c0 = calc(o.salary, baseOpts);
  const variant = (taxed, free, parts) => {
    const c1 = calc(o.salary, { ...baseOpts, extra: taxed });
    const emp = { opv:c1.opv-c0.opv, vosms:c1.vosms-c0.vosms, ipn:c1.ipn-c0.ipn };
    const er  = { opvr:c1.opvr-c0.opvr, oosms:c1.oosms-c0.oosms, so:c1.so-c0.so, sn:c1.sn-c0.sn };
    const empT = emp.opv + emp.vosms + emp.ipn, erT = er.opvr + er.oosms + er.so + er.sn;
    return { paid, free, taxed, parts, emp, er, empT, erT, net: paid - empT, cost: paid + erT };
  };
  return { lim, trip: variant(tripTaxed, tripFree, tripParts), road: variant(roadTaxed, roadFree, roadParts), P, days, over40 };
}

  const t = T[lang];
  document.documentElement.lang = lang === 'kz' ? 'kk' : 'ru';
  document.title = t.title + ' — edubuh';
  document.querySelectorAll('[data-i]').forEach(el => { const v = t[el.dataset.i]; if (typeof v === 'string') el.textContent = v; });
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  const ms = $('month'), cur = ms.value || String(new Date().getMonth() + 1);
  ms.innerHTML = t.months.map((m, i) => `<option value="${i+1}">${m}</option>`).join('');
  ms.value = cur;
  if (!$('d1').value) fillDays();
  render();
}

const row = (label, val, hint, exempt) =>
  `<tr><td>${label}${hint?`<span class="hint">${hint}</span>`:''}</td><td class="n">${exempt?`<span class="ex">${T[lang].exempt}</span>`:fmt(val)}</td></tr>`;
const tot = (label, val) => `<tr class="tot"><td>${label}</td><td class="n">${fmt(val)}</td></tr>`;

function render(){
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  document.querySelectorAll('[data-pane]').forEach(p => p.hidden = p.dataset.pane !== tab);
  if (tab === 'zp') renderZp(); else if (tab === 'trip') renderTrip(); else renderGph();
}

function renderGph(){
  const t = T[lang], y = Number($('gYear').value), P = YEARS[y];
  const o = { year:y, basic:$('gBasic').checked, pensioner:$('gPens').checked, subj:$('gSubj').value };
  document.querySelectorAll('[data-gmode]').forEach(b => b.classList.toggle('on', b.dataset.gmode === gmode));
  $('gAmountLabel').textContent = gmode === 'direct' ? t.gAmtDirect : t.amountReverse;
  $('gBasicLabel').textContent = t.gBasicLabel(P.BASIC_DED_MRP);
  $('gNote').textContent = t.gNote(y);
  $('disclaimer').textContent = t.disclaimer(y);
  const a = num('gAmount') || 0;
  const c = gmode === 'direct' ? calcGph(a, o) : reverseGph(a, o);
  gLast = c;
  $('gHero1').textContent = fmt(c.base); $('gHero2').textContent = fmt(c.net);
  let ipnHint = c.services ? t.gIpnHint(fmt(c.taxable), fmt(c.basicUsed), y) : t.gIpnHintNs(fmt(c.taxable), fmt(c.basicUsed));
  if (c.high > 0) ipnHint += '; ' + t.ipnHigh(fmt(c.high));
  const noRow = (label) => `<tr><td>${label}<span class="hint">${t.gNotWithheldHint}</span></td><td class="n"><span class="ex">${t.gNotWithheld}</span></td></tr>`;
  $('gTab').innerHTML = (c.services ? row(t.opv, c.opv, '', c.pens) : noRow(t.opv)) + row(t.vosms, c.vosms, '', c.pens) +
    (c.services ? row(t.gSo, c.so, t.gSoHint(y), c.pens) : noRow(t.gSo)) + row(t.ipn, c.ipn, ipnHint) + tot(t.totalEmp, c.withheld);
  $('gCmpBlock').hidden = !c.services;
  $('gAgent').innerHTML = row(t.gAgentNone, 0, t.gAgentNoneHint) + tot(t.cCost, c.cost);

  const e = calc(c.base, { year:y, employer:$('gEmployer').value, basic:o.basic, pensioner:o.pensioner, disability:'none' });
  const eWith = e.opv + e.vosms + e.ipn;
  const cheaperGph = c.cost < e.cost, moreNetGph = c.net > e.net;
  const cellv = (v, strong) => `<td class="n${strong ? ' best' : ''}">${fmt(v)}</td>`;
  const rw = (label, a1, a2, isTot, best1, best2) => `<tr${isTot?' class="tot"':''}><td>${label}</td>${cellv(a1, best1)}${cellv(a2, best2)}</tr>`;
  $('gCmp').innerHTML = `<table class="ct"><thead><tr><th></th><th>${t.gColGph}</th><th>${t.gColEmp}</th></tr></thead><tbody>` +
    rw(t.cAccr, c.base, e.accrued) + rw(t.cWith, c.withheld, eWith) +
    rw(t.cNet, c.net, e.net, true, moreNetGph, !moreNetGph && e.net > c.net) +
    rw(t.cEr, 0, e.employerTotal) +
    rw(t.cCost, c.cost, e.cost, true, cheaperGph, !cheaperGph && e.cost < c.cost) + '</tbody></table>';
  $('gRules').innerHTML = t.gRules(y).map(x => `<li>${x}</li>`).join('');
  const w = [];
  if (c.high > 0) w.push(t.gWarnHigh);
  if (!o.basic && c.base > 0) w.push(t.warnBasicOff);
  $('gWarn').hidden = !w.length; $('gWarn').innerHTML = w.map(x=>`<p>${x}</p>`).join('');
}

function renderZp(){
  const t = T[lang], o = opts(), a = num('amount') || 0, P = YEARS[o.year];
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  $('amountLabel').textContent = mode === 'direct' ? t.amountDirect : t.amountReverse;
  $('basicLabel').textContent = t.basic(P.BASIC_DED_MRP, o.year);
  $('tripNote').textContent = t.tripNote(fmt(P.PERDIEM_RK_MRP*P.MRP), fmt(P.PERDIEM_ABR_MRP*P.MRP));
  $('ytdNote').textContent = t.ytdNote(P.IPN_HIGH_THRESHOLD_MRP ? fmt(P.IPN_HIGH_THRESHOLD_MRP*P.MRP) : '', o.year);
  $('disclaimer').textContent = t.disclaimer(o.year);
  $('splitBox').hidden = !o.split;
  $('advPctField').hidden = o.advType !== 'pct';
  const lastDay = new Date(o.year, Number($('month').value), 0).getDate();
  $('d2Label').textContent = t.d2(lastDay);

  const c = mode === 'direct' ? calc(a, o) : reverse(a, o);
  last = c;
  $('heroGross').textContent = fmt(c.total);
  $('heroNet').textContent = fmt(c.net);

  $('bTrip').hidden = !c.perDiem; $('bTrip').textContent = fmt(c.perDiem);
  $('bPart').hidden = !c.partial; $('bPart').textContent = `${c.worked}/${c.norm}`;
  $('bYtd').hidden = !(o.ytd || o.disUsed); $('bYtd').textContent = '✓';

  let acc = '';
  if (c.partial || c.perDiem){
    acc += row(t.accSalary, c.accrued, c.partial ? t.accSalaryHint(c.worked, c.norm, fmt(c.base)) : '');
    if (c.perDiem) acc += row(t.accPerDiem, c.perDiem, t.accPerDiemHint(fmt(c.perDiemFree), c.perDiemTaxed ? fmt(c.perDiemTaxed) : ''));
  }
  $('accrualBlock').hidden = !acc; $('tAcc').innerHTML = acc;

  let ipnHint = t.ipnHint(fmt(c.taxable), fmt(c.basicUsed), c.socialUsed ? fmt(c.socialUsed) : '', c.corr ? fmt(c.corr) : '');
  if (c.high > 0) ipnHint += '; ' + t.ipnHigh(fmt(c.high));
  $('tEmp').innerHTML = row(t.opv, c.opv, '', c.ex.opv) + row(t.vosms, c.vosms, '', c.ex.vosms) + row(t.ipn, c.ipn, ipnHint) +
    tot(t.totalEmp, c.opv + c.vosms + c.ipn);
  const snHint = o.employer==='too' ? (o.hire ? t.snTooHire : t.snToo)(P.SN_TOO, P.SN_MINUS_SO) : o.employer==='ip' ? t.snIp(P.SN_MINUS_SO) : t.snSnr;
  $('tEr').innerHTML = row(t.opvr(P.OPVR), c.opvr, '', c.ex.opvr) + row(t.oosms, c.oosms, '', c.ex.oosms) +
    row(t.so, c.so, t.soHint, c.ex.so) + row(t.sn, c.sn, snHint) +
    tot(t.totalEr, c.employerTotal) + tot(t.cost, c.cost);

  let so = '';
  if (o.split){
    const s = splitHalves(c, o);
    const half = (title, h, hint) => `<h2>${title}</h2><table>` +
      row(t.splitInc, h.income, hint) + row(t.opv, h.opv, '', c.ex.opv) + row(t.vosms, h.vosms, '', c.ex.vosms) + row(t.ipn, h.ipn) +
      tot(t.splitNet, h.net) + '</table>';
    so += `<h2 class="big">${t.secSplit}</h2>`;
    so += half(t.secH1, s.h1, o.advType === 'pct' ? t.h1HintPct(o.advPct) : t.h1Hint(s.d1, s.d1 + s.d2));
    so += half(t.secH2(lastDay), s.h2, o.advType === 'pct' ? '' : t.h1Hint(s.d2, s.d1 + s.d2));
  }
  $('splitOut').innerHTML = so;

  const w = [];
  if (c.base > 0 && c.base < P.MZP) w.push(t.warnLow);
  if (!o.basic && c.base > 0) w.push(t.warnBasicOff);
  if ((o.daysRk >= 40 && o.rateRk) || (o.daysAbr >= 40 && o.rateAbr)) w.push(t.warn40);
  if (o.norm && o.worked !== null && o.worked > o.norm) w.push(t.warnDays);
  $('warn').hidden = !w.length; $('warn').innerHTML = w.map(x=>`<p>${x}</p>`).join('');
}

function renderTrip(){
  const t = T[lang], o = tripOpts(), P = YEARS[o.year];
  $('tBasicLabel').textContent = t.tBasicLabel(P.BASIC_DED_MRP);
  $('disclaimer').textContent = t.disclaimer(o.year);
  const c = calcTrip(o);
  $('tHeroA').textContent = fmt(c.trip.cost);
  $('tHeroB').textContent = fmt(c.road.cost);
  const d = c.trip.cost - c.road.cost;
  $('tHeroNote').textContent = t.tHeroNote(d, d > 0 ? t.vRoad : t.vTrip);

  const limTxt = fmt(c.lim);
  const box = (title, v, isBest, partsRows) => `<div class="box${isBest?' best':''}">
    <h3>${title}${isBest?`<span class="tag">${t.vBest}</span>`:''}</h3><table>
    ${row(t.vPaid, v.paid)}
    ${row(t.vFree, v.free)}
    ${row(t.vTaxed, v.taxed, partsRows)}
    ${row(t.vEmp, v.empT, t.vEmpHint)}
    ${tot(t.vNet, v.net)}
    ${row(t.vEr, v.erT, t.vErHint)}
    ${tot(t.vCost, v.cost)}
    </table></div>`;
  const hintParts = (list) => list.filter(x => x[1] > 0).map(x => `${x[0]}: ${fmt(x[1])}`).join('; ');
  const tripHint = hintParts([[t.vOverLimTrip(limTxt), c.trip.parts.overLimit],[t.vOver40, c.trip.parts.over40],[t.vDocs, c.trip.parts.docs]]);
  const roadHint = hintParts([[t.vOverLimRoad, c.road.parts.overLimit],[t.vDocs, c.road.parts.docs]]);
  $('tCmp').innerHTML = box(t.vTrip, c.trip, d < 0, tripHint) + box(t.vRoad, c.road, d > 0, roadHint);
  const bA = d < 0, bB = d > 0;
  const th = (title, best) => `<th class="${best?'best':''}">${title}${best?`<br><span class="tag">${t.vBest}</span>`:''}</th>`;
  const cell = (v, best, hint, strong) => `<td class="n${best && strong ? ' best' : ''}">${fmt(v)}${hint?`<span class="hint">${hint}</span>`:''}</td>`;
  const r2 = (label, k, hintL, hA, hB, isTot) => `<tr${isTot?' class="tot"':''}><td>${label}${hintL?`<span class="hint">${hintL}</span>`:''}</td>${cell(c.trip[k], bA, hA, isTot)}${cell(c.road[k], bB, hB, isTot)}</tr>`;
  $('tCmpWide').innerHTML = `<table class="ct"><thead><tr><th></th>${th(t.vTrip, bA)}${th(t.vRoad, bB)}</tr></thead><tbody>` +
    r2(t.vPaid, 'paid') + r2(t.vFree, 'free') + r2(t.vTaxed, 'taxed', '', tripHint, roadHint) +
    r2(t.vEmp, 'empT', t.vEmpHint) + r2(t.vNet, 'net', '', '', '', true) +
    r2(t.vEr, 'erT', t.vErHint) + r2(t.vCost, 'cost', '', '', '', true) + '</tbody></table>';

  const lims = { rk: fmt(P.PERDIEM_RK_MRP*P.MRP), abr: fmt(P.PERDIEM_ABR_MRP*P.MRP) };
  $('rTrip').innerHTML = t.rTrip(lims).map(x => `<li>${x}</li>`).join('');
  $('rRoad').innerHTML = t.rRoad().map(x => `<li>${x}</li>`).join('');

  const w = [];
  if (!o.salary) w.push(t.tWarnSalary);
  if (!o.norm && o.rate) w.push(t.tWarnNoNorm);
  if (o.noDocs && o.docs) w.push(t.tWarnDocs);
  $('tWarn').hidden = !w.length; $('tWarn').innerHTML = w.map(x=>`<p>${x}</p>`).join('');
  last = c;
}

function copyText(which){
  const t = T[lang], lines = [];
  const pane = document.querySelector(`[data-pane="${which}"]`);
  lines.push(`${t.title} — edubuh`);
  pane.querySelectorAll('.hero .k').forEach((k, i) => lines.push(`${k.textContent}: ${pane.querySelectorAll('.hero .v')[i].textContent}`));
  pane.querySelectorAll('h2, h3, tr').forEach(el => {
    if (!el.getClientRects().length) return;
    if (el.tagName === 'TR'){
      const tds = el.querySelectorAll('td'); if (tds.length < 2) return;
      lines.push(`${tds[0].firstChild ? tds[0].firstChild.textContent : tds[0].textContent}: ${tds[1].textContent}`);
    } else { lines.push(''); lines.push(el.firstChild ? el.firstChild.textContent : el.textContent); }
  });
  const btn = pane.querySelector('[data-copy]');
  const done = () => { btn.textContent = t.copied; setTimeout(() => btn.textContent = t.copy, 1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(lines.join('\n')).then(done).catch(()=>{});
}

function groupDigits(el, max){ const n = el.value.replace(/[^\d]/g,'').slice(0, max); el.value = n ? sp(Number(n)) : ''; }
const SHORT = ['norm','worked','daysRk','daysAbr','d1','d2','advPctV','tDays','tOver40'];
document.querySelectorAll('input.num').forEach(el => el.addEventListener('input', () => { groupDigits(el, SHORT.includes(el.id) ? 3 : 10); render(); }));
document.querySelectorAll('select, input[type=checkbox]').forEach(el => el.addEventListener('change', render));
['month','year'].forEach(id => $(id).addEventListener('change', () => { fillDays(); render(); }));
document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
  tab = b.dataset.tab; try { localStorage.setItem('zp-tab', tab); } catch(e){}
  render();
}));
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
  if (mode === b.dataset.mode) return;
  const c = last; mode = b.dataset.mode;
  if (c && c.base !== undefined) $('amount').value = sp(mode === 'direct' ? c.base : c.net);
  render();
}));
document.querySelectorAll('[data-gmode]').forEach(b => b.addEventListener('click', () => {
  if (gmode === b.dataset.gmode) return;
  gmode = b.dataset.gmode;
  if (gLast) $('gAmount').value = sp(gmode === 'direct' ? gLast.base : gLast.net);
  render();
}));
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang; try { localStorage.setItem('zp-lang', lang); } catch(e){}
  applyLang();
}));
document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => copyText(b.dataset.copy)));
document.querySelectorAll('[data-print]').forEach(b => b.addEventListener('click', () => window.print()));
applyLang();
</script>
</body>
